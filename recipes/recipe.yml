---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: bazz-hypr
description: Bazzite (Nvidia, open kernel modules) with Hyprland + illogical-impulse (Quickshell) as the default session and end4-pC as an additional shell. KDE Plasma stays installed as a fallback session and as the supplier of the KDE services illogical-impulse depends on.
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  # ---------------------------------------------------------------------------
  # 1. Packages
  # ---------------------------------------------------------------------------
  # Source of the package list: end-4/dots-hyprland -> sdata/dist-fedora/feddeps.toml
  # (the upstream project's official list, tested on Fedora 44).
  #
  # Deliberately NOT taken from feddeps.toml:
  #   grub2-breeze-theme  - would re-theme the bootloader; unnecessary risk on
  #                         an atomic system.
  #   sddm-breeze         - would re-theme the login manager; Bazzite brings its
  #                         own SDDM theming.
  # Deviation from feddeps.toml for quickshell: upstream takes quickshell-git
  # from ririko66z/dots-hyprland. That build is linked against Qt 6.10 and is
  # not installable on Bazzite (Qt 6.11) - the first CI build failed on it.
  # errornointernet/quickshell is used instead, built against Qt 6.11.
  # ---------------------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        # Hyprland 0.56.x (Lua config). solopasha/hyprland is dead: it only has
        # 0.49.0 and only for Fedora 41. Upstream's feddeps.toml points at this
        # fork itself.
        - sdegler/hyprland
        # Only for the Qt-free packages now: microtex, breakpad, songrec,
        # bibata-cursor-theme, breeze-plus-icon-theme and the fonts.
        #
        # NOT for quickshell-git and hyprland-qt-support: those builds are from
        # 2025-12-18 and linked against Qt 6.10. Bazzite has Qt 6.11 and blocks
        # the downgrade, and quickshell binds Qt private APIs version-exactly.
        # The first CI build failed on precisely this.
        - ririko66z/dots-hyprland
        # Ships quickshell-git built against Qt 6.11 and is actively maintained
        # (build from 2026-09-04 versus 2025-12-18 at ririko66z).
        - errornointernet/quickshell
        - deltacopy/darkly
        # eza is in Fedora 44 itself by now - the COPR alternateved/eza named by
        # feddeps.toml is therefore redundant.
        - atim/starship
    install:
      # Individual packages can be missing depending on the Fedora release; the
      # build should not fail on that. What is actually missing shows up in the
      # build log afterwards.
      skip-unavailable: true
      packages:
        # --- Audio ---
        - cava
        - pavucontrol
        - wireplumber
        - libdbusmenu-gtk3-devel
        - playerctl
        # --- Backlight / sensors ---
        - geoclue2
        - brightnessctl
        - ddcutil
        # --- Base tools ---
        - bc
        - cliphist
        - wget2
        - ripgrep
        - yq
        # bazz-hypr-seed needs rsync at runtime, the install-dots.sh build step
        # needs git. Both are very likely present in the base already - listed
        # explicitly so that this is not silently assumed.
        - rsync
        - git
        # --- Cursor / Fonts / Themes ---
        - bibata-cursor-theme
        - adw-gtk3-theme
        - breeze-cursor-theme
        - breeze-icon-theme
        - breeze-icon-theme-fedora
        - kf6-breeze-icons
        - breeze-plus-icon-theme
        - darkly
        - eza
        - fish
        - kitty
        - florian-karsten-space-grotesk-fonts
        - starship
        - jetbrains-mono-nerd-fonts
        - google-material-symbols-vf-rounded-fonts
        - material-icons-fonts
        - readex-pro-fonts-all
        - google-rubik-vf-fonts
        - twitter-twemoji-fonts
        - google-sans-flex-vf-fonts
        # --- Hyprland ---
        - hyprland
        - hyprland-guiutils
        - hyprsunset
        - wl-clipboard
        # Bound to Qt private APIs: take it explicitly from sdegler. ririko66z
        # has the same package, but built against Qt 6.10.
        - repo: copr:copr.fedorainfracloud.org:sdegler:hyprland
          packages:
            - hyprland-qt-support
        # --- KDE services that illogical-impulse requires ---
        # Almost all of them are already present in Bazzite Kinoite; listed
        # explicitly here so the image does not break should the base ever stop
        # shipping them. gnome-keyring genuinely is missing from Bazzite.
        - bluedevil
        - gnome-keyring
        # The PAM module sits in a subpackage of its own. Without it,
        # gnome-keyring asks for the password again after every login via
        # gcr-prompter - /usr/lib/pam.d/plasmalogin does already reference
        # pam_gnome_keyring.so, but with a leading "-", i.e. "skip if the module
        # is missing". With the package the login manager unlocks the keyring
        # automatically using the login password.
        - gnome-keyring-pam
        - plasma-nm
        - polkit-kde
        - dolphin
        - plasma-systemsettings
        - plasma-systemmonitor
        - kdialog
        # --- MicroTeX (LaTeX rendering in the shell) ---
        - microtex
        # --- XDG-Portals ---
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-kde
        - xdg-desktop-portal-hyprland
        # --- Python toolchain for the venv ---
        # These -devel packages are NOT a build leftover: pygobject, pycairo and
        # dbus-python ship no wheels and are compiled from source when the venv
        # is built.
        - uv
        # Upstream pins Python 3.12 (Pillow does not build on newer versions,
        # see python-pillow/Pillow#8089). Fedora 44 ships 3.12.14 as its own
        # package - so the venv build does not depend on whether uv is allowed
        # to download an interpreter itself.
        - python3.12
        - python3.12-devel
        - gcc
        - clang
        - pkgconf-pkg-config
        - python3-devel
        - glib2-devel
        - cairo-devel
        - cairo-gobject-devel
        - dbus-devel
        - gtk4-devel
        - libadwaita-devel
        - libsoup3-devel
        - libportal-gtk4
        - gobject-introspection-devel
        # --- Quickshell runtime ---
        - qt6-qtdeclarative
        - qt6-qtbase
        - jemalloc
        - qt6-qtsvg
        - pipewire-libs
        - wayland-devel
        - qt6-qtwayland
        - qt5-qtwayland
        - breakpad
        - kf6-kirigami
        - libunwind-devel
        - qt6-qt5compat
        - qt6-qtimageformats
        - qt6-qtpositioning
        - qt6-qtquicktimeline
        - qt6-qtsensors
        - qt6-qttools
        - qt6-qttranslations
        - qt6-qtvirtualkeyboard
        - kf6-syntax-highlighting
        # --- illogical-impulse core ---
        # quickshell-git deliberately WITHOUT repo: pinning.
        #
        # A "repo:" entry restricts resolution to exactly that one repo.
        # quickshell-git pulls in cpptrace, which in turn needs libdwarf.so.2
        # from the Fedora repo - with pinning that was invisible and the second
        # CI build failed on "nothing provides libdwarf.so.2".
        #
        # Without pinning dnf picks the highest version, and that is
        # errornointernet (0.3.1^856) ahead of ririko66z (0.2.1^713). So the
        # candidate built against Qt 6.11 is chosen automatically.
        - quickshell-git
        # matugen is in Fedora 44 itself.
        - matugen
        # --- Screenshot / Screencapture ---
        - hyprshot
        - slurp
        - swappy
        - tesseract
        - tesseract-langpack-eng
        - wf-recorder
        # --- Toolkit ---
        - upower
        - wtype
        - ydotool
        # --- Widgets / helper programs ---
        - fuzzel
        - ImageMagick
        - hypridle
        - hyprlock
        - hyprpicker
        - songrec
        - translate-shell
        - qalculate
        - wlogout
        # --- Extra ---
        - mpvpaper

  # ---------------------------------------------------------------------------
  # 2. Bake dotfiles + venv into the image
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - install-dots.sh
      - build-venv.sh

  # ---------------------------------------------------------------------------
  # 3. System files (udev, modprobe, systemd units)
  # ---------------------------------------------------------------------------
  - type: files
    files:
      - source: system
        destination: /

  # ---------------------------------------------------------------------------
  # 4. Wire up services
  # ---------------------------------------------------------------------------
  - type: script
    scripts:
      - enable-services.sh

  # ---------------------------------------------------------------------------
  # 5. Signing
  # ---------------------------------------------------------------------------
  - type: signing
