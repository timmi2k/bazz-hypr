# Turn on DRM modesetting explicitly.
#
# Hyprland requires it (wiki.hypr.land/Nvidia/). From driver 570.86.16 onwards
# fbdev is enabled automatically as soon as modeset is on - a separate fbdev
# switch is therefore no longer needed.
#
# Bazzite's own /usr/lib/modprobe.d/nvidia.conf does not set this explicitly;
# on current drivers it is the default anyway, but pinned here it cannot fall
# away through a change of driver defaults. The value is the same one the
# driver uses anyway - so there is no conflict.
options nvidia_drm modeset=1
