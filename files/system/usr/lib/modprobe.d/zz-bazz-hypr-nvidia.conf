# DRM-Modesetting explizit einschalten.
#
# Hyprland setzt das voraus (wiki.hypr.land/Nvidia/). Ab Treiber 570.86.16 wird
# fbdev automatisch mit aktiviert, sobald modeset an ist - ein separater
# fbdev-Schalter ist also nicht mehr noetig.
#
# Bazzites eigene /usr/lib/modprobe.d/nvidia.conf setzt das nicht explizit; auf
# aktuellen Treibern ist es zwar ohnehin der Default, aber hier festgeschrieben
# kann es nicht durch eine Treiber-Default-Aenderung wegkippen. Der Wert ist
# derselbe, den der Treiber ohnehin verwendet - es gibt also keinen Konflikt.
options nvidia_drm modeset=1
