# Bound how much work a single core dump may cause.
#
# systemd defaults both limits to 32G on 64-bit. On a 31 GiB machine whose only
# swap is zram - which lives in RAM and therefore frees nothing under real
# pressure - that is larger than the machine itself. When a big GPU-accelerated
# Electron process dies (Discord mid-screenshare is the reproducer), the dump
# alone can exhaust RAM and livelock the box hard enough to need the reset
# button, turning a crash that should have killed one app into a lost session.
#
# ExternalSizeMax is the limit that actually bounds the work: systemd-coredump
# streams the core and stops at this size ("Core file was truncated to N
# bytes"). ProcessSizeMax only governs stack-trace extraction, which is the
# memory-hungry libdw step - anything past it is still written out, so both
# have to be capped, not just one.
#
# 4G is chosen as generous rather than tight. It is not a debuggability
# ceiling worth worrying about: a core truncated at 4G is already of little
# use, the crash itself is still recorded in the journal either way, and
# MaxUse caps total coredump storage at 4 GiB by default regardless. The
# former systemd default was 2G, so this is still the roomier of the two.
[Coredump]
ProcessSizeMax=4G
ExternalSizeMax=4G
