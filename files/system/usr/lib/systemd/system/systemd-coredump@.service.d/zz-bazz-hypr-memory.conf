# Hard ceiling on the dumper itself, as a backstop to the size caps in
# coredump.conf.d/zz-bazz-hypr-coredump.conf.
#
# systemd ships this unit with MemoryMax=infinity, so the one process whose job
# is to react to a crash is also the one process allowed to take the machine
# down with it. The size caps should already keep it well under this, so
# hitting the limit means something went wrong that the caps did not predict -
# and being OOM-killed is the right outcome there.
#
# Failure mode if it does trip: no core file and no stack trace for that crash.
# The crash is still recorded in the journal, which is the part actually used
# when working out what died.
[Service]
MemoryMax=2G
